[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-ai"
version = "2.0.0"
description = "Asistente personal local con proveedores de IA opcionales."
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = ["platformdirs>=4.0"]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
voz = [
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "openwakeword==0.4.0",
]

[project.scripts]
orion = "main:ejecutar"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["comandos*", "core*", "ia*", "servicios*", "utilidades*"]

[tool.setuptools.package-data]
"core.skills" = ["*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["comandos", "core", "ia", "servicios", "utilidades", "main"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["F", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fuera de alcance: el núcleo y el planificador no se modifican en este sprint.
# SIM103: se prefiere el estilo actual con retornos tempranos.
# S311: random para variedad de respuestas, no uso criptográfico.
"core/cerebro.py" = ["SIM103", "S311"]
"core/planificador/resolucion.py" = ["SIM103"]
# S311: random para variedad de respuestas, no uso criptográfico.
"core/handlers/intencion.py" = ["S311"]
"core/personalidad.py" = ["S311"]
# S310: urlopen a endpoints fijos de los proveedores (Groq https / Ollama local).
"ia/groq.py" = ["S310"]
"ia/ollama.py" = ["S310"]
# Fuera de alcance: el proveedor IA no se modifica en este sprint (SIM103).
"ia/proveedor.py" = ["SIM103"]
# S603/S607: subprocess intencional para lanzar aplicaciones del sistema.
"servicios/sistema/acciones_pc.py" = ["S603", "S607"]
# S603: subprocess intencional de espeak para la síntesis de voz.
"servicios/voz/tts.py" = ["S603"]
# S108: cadena de prueba que representa una ruta, no uso real de /tmp.
"tests/test_intenciones.py" = ["S108"]
