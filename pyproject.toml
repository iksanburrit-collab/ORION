[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-ai"
version = "2.0.0"
description = "Asistente personal local con proveedores de IA opcionales."
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = ["platformdirs>=4.0"]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
voz = [
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
]

[project.scripts]
orion = "main:ejecutar"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["comandos*", "core*", "ia*", "servicios*", "utilidades*"]

[tool.setuptools.package-data]
"core.skills" = ["*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["comandos", "core", "ia", "servicios", "utilidades", "main"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["F"]
